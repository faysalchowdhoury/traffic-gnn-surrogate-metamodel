[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-gnn-surrogate-metamodel"
version = "1.0.0"
description = "GNN (PyTorch Geometric) and LightGBM surrogates of a closed-loop signalised-corridor simulator, with registry, drift monitoring and FastAPI serving."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pydantic>=2.6,<3", "pyyaml>=6.0", "matplotlib>=3.8",
                "scikit-learn>=1.4", "lightgbm>=4.3", "torch>=2.2", "torch_geometric>=2.5"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "redis>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
gnnsurrogate = "gnnsurrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
